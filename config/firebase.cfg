; 3D PARTY WORLD — Firebase 설정 (프로젝트 game-28f1b)
; git 에 포함됨: 여기 값은 전부 공개 웹 사이트에도 들어가는 공개 식별자라서 커밋해도 안전하다.
; 다른 Firebase 프로젝트를 쓰려면 firebase.example.cfg 를 참고해 값을 바꾼다.
;
; [firebase]
;   api_key     : Firebase 콘솔 → 프로젝트 설정 → 일반 → "웹 API 키"
;   project_id  : Firebase 콘솔 → 프로젝트 설정 → 일반 → "프로젝트 ID"
;   (웹 API 키는 클라이언트에 포함되는 공개 식별자입니다. 비밀키가 아닙니다.)
;
; [google_oauth]  (PC Google 로그인용, 선택)
;   Google Cloud 콘솔 → API 및 서비스 → 사용자 인증 정보 → OAuth 클라이언트 ID 만들기
;   → 애플리케이션 유형 "데스크톱 앱" 으로 생성한 클라이언트 ID / 보안 비밀
;   (데스크톱 앱 클라이언트의 보안 비밀은 Google 정책상 공개 클라이언트로 취급됩니다.)
;   Firebase 콘솔 → Authentication → 로그인 방법 → Google → "외부 프로젝트의 클라이언트 ID 허용 목록"에
;   이 클라이언트 ID 를 추가해야 할 수 있습니다.
;
; 절대 넣지 말 것: 서비스 계정 JSON, DB 비밀번호, 서버 비밀키

