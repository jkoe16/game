# Render 배포 설정 (server/cloud/README.md 참고). Render 대시보드 → New → Blueprint → 이 저장소 선택
services:
  - type: web
    name: 3d-party-world
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free           # 무료: 15분 동안 아무도 없으면 잠들고, 다음 접속 때 30초~1분 뒤 깨어남 (게임이 자동으로 기다렸다 접속)
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
