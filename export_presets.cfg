html/custom_html_shell=""
html/head_include="<script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'></script>
<script src='https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'></script>
<script>
// 3D PARTY WORLD: Google login popup -> returns only the Google ID token to Godot (scripts/auth/web_google_auth.gd)
window.pwGoogleSignIn = function (apiKey, authDomain, linkMode, cb) {
  var done = function (o) { cb(JSON.stringify(o)); };
  try {
    var app = firebase.apps.length ? firebase.app() : firebase.initializeApp({ apiKey: apiKey, authDomain: authDomain });
    var auth = app.auth();
    var p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(p).then(function (res) {
      var tok = res.credential && res.credential.idToken;
      var isNew = res.additionalUserInfo && res.additionalUserInfo.isNewUser;
      var cleanup = (linkMode && isNew && res.user) ? res.user.delete() : auth.signOut();
      return Promise.resolve(cleanup).catch(function () {}).then(function () {
        done({ ok: !!tok, id_token: tok || '', code: tok ? '' : 'no-token' });
      });
    }).catch(function (e) { done({ ok: false, code: e.code || '', message: String(e.message || e) }); });
  } catch (e) { done({ ok: false, code: 'init', message: String(e) }); }
};
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

